<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Trail Circles (No Grain Filter)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <style>
        /* Basic reset and body styling */
        :root {
            /* Daytime Theme Variables (Default) */
            --bg-grad-start: #BFBECF;
            --bg-grad-end: #FF6A3A;
            --dynamic-color1: #EAEE81; /* Yellow */
            --dynamic-color1-rgba: rgba(234, 238, 129, 0);
            --dynamic-color2: #f0cf72; /* Mid-Yellow */
            --dynamic-color2-rgba: rgba(240, 207, 114, 0);
            --dynamic-color3: #f5b666; /* Orange */
            --dynamic-color3-rgba: rgba(245, 182, 102, 0);
            --instructions-color: rgba(0, 0, 0, 0.6); /* Adjusted for lighter background */
            --button-border: rgba(0, 0, 0, 0.8); /* Black border */
            --button-text: rgba(0, 0, 0, 0.8); /* Black text */
            --button-hover-bg: rgba(0, 0, 0, 0.05); /* Subtle black bg hover */
            --button-hover-text: black;
            --button-hover-border: black;
            --button-active-bg: rgba(0, 0, 0, 0.1); /* Darker black bg active */
            /* REMOVED: --grain-opacity: 0.07; */
        }

        body.nighttime {
            /* Nighttime Theme Variables */
            --bg-grad-start: #120AA9;
            --bg-grad-end: #9795BC;
            --dynamic-color1: #E3D9FF; /* Lightest Purple */
            --dynamic-color1-rgba: rgba(227, 217, 255, 0);
            --dynamic-color2: #D1C1FF; /* Mid Purple */
            --dynamic-color2-rgba: rgba(209, 193, 255, 0);
            --dynamic-color3: #B399FF; /* Darker Purple */
            --dynamic-color3-rgba: rgba(179, 153, 255, 0);
            /* Stage 4 uses color 2 again */
            --instructions-color: rgba(200, 200, 255, 0.7);
            --button-border: rgba(200, 200, 255, 0.8);
            --button-text: rgba(200, 200, 255, 0.8);
            --button-hover-bg: rgba(200, 200, 255, 0.15);
            --button-hover-text: #e0e0ff;
            --button-hover-border: #e0e0ff;
            --button-active-bg: rgba(200, 200, 255, 0.25);
            /* REMOVED: --grain-opacity: 0.1; */
        }


        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            /* Use CSS variables for background */
            background-image: linear-gradient(to bottom, var(--bg-grad-start), var(--bg-grad-end));
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
            cursor: crosshair;
            font-family: sans-serif;
            /* Add transition for background change */
             transition: background-image 0.5s ease-in-out;
        }

        /* REMOVED: Pseudo-element for grain overlay */
        /* body::before { ... } */

        /* Static Center Circle (Inner) - Made invisible */
        #centerCircle {
            position: absolute;
            width: 75vh;
            height: 75vh;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: none; /* Removed background */
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        /* Static Transparent Center Circle (Outer Ring) - Made invisible */
        #CenterTCircle {
            position: absolute;
            width: 75vh; /* User edited size */
            height: 75vh; /* User edited size */
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background-color: transparent;
            border: none; /* Removed border */
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            box-sizing: border-box;
        }

        /* Keyframes for the shrinking animation */
        @keyframes shrink {
            from { --shrink-scale: 1; }
            to { --shrink-scale: 0; }
        }

        /* Styling for the dynamic circles container */
        .circle {
            position: absolute;
            pointer-events: none;
            animation-name: shrink;
            animation-timing-function: linear;
            animation-iteration-count: 1;
            animation-direction: normal;
            animation-fill-mode: forwards;
            animation-duration: var(--shrink-duration, 5s);
            animation-delay: 0s;
            transform-origin: center center;
            --shrink-scale: 1;
            transform: scale(var(--initial-scale, 1));
            /* Transition for opacity fade-out */
            transition: opacity 1s ease-out;
        }

        /* Styling for the visible part of the dynamic circle (inner element) */
        .circle .core {
             position: absolute;
             width: 100%;
             height: 100%;
             /* Background set dynamically by JS using CSS variables */
             border-radius: 50%;
             left: 0;
             top: 0;
             transform: scale(1);
             /* Use CSS variable for transition */
             /* *** Updated transition duration *** */
             transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Apply scale-up when container has .stopped-scaled class */
        .circle.stopped-scaled .core {
             transform: scale(1.7);
        }


        /* Styling for the overlap particles */
        .overlap-particle {
            position: absolute;
            /* Background set by JS using CSS variables */
            background-color: var(--dynamic-color1); /* Default color */
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-out, transform 1.5s ease-out;
            transform: scale(1);
        }

        .overlap-particle.fading {
            opacity: 0;
            transform: scale(0);
        }

        /* REMOVED: .fade-particle CSS rules */


        /* Class added to trigger fade-out for main circles */
        .circle.fading-out {
            opacity: 0 !important;
        }


        /* REMOVED: #instructions CSS rule */


        /* Styling for Buttons Container */
        #buttonContainer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 101;
            display: flex;
            gap: 10px; /* Space between buttons */
        }

        /* Styling for the Buttons */
        .control-button {
            padding: 8px 12px; /* Adjusted padding slightly for emoji only */
            background-color: transparent;
            border: 1px solid var(--button-border); /* Use variable */
            color: var(--button-text); /* Use variable */
            border-radius: 9999px;
            cursor: pointer;
            font-size: 16px; /* Slightly larger font for emoji */
            line-height: 1; /* Adjust line height for emoji centering */
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .control-button:hover {
            background-color: var(--button-hover-bg); /* Use variable */
            color: var(--button-hover-text); /* Use variable */
            border-color: var(--button-hover-border); /* Use variable */
        }

         .control-button:active {
            background-color: var(--button-active-bg); /* Use variable */
         }

    </style>
</head>
<body>
    <div id="centerCircle"></div>
    <div id="CenterTCircle"></div>

    <div id="buttonContainer">
        <button id="themeToggle" class="control-button">🌙</button>
    </div>

    <script>
        // Get elements
        const canvas = document.body;
        const themeToggle = document.getElementById('themeToggle'); // Get theme button

        // --- Audio Setup ---
        const synth = new Tone.Synth({
             oscillator: { type: 'sine' },
             envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.4 }
        }).toDestination();
        const minFrequency = 220; // A3
        const maxFrequency = 880; // A5
        const frequencyRange = maxFrequency - minFrequency;


        // --- State variables ---
        let mouseX = 0;
        let mouseY = 0;
        let lastCircleTime = 0;
        const circleInterval = 10;
        let mouseHistory = [];
        const creationDelayMs = 10;
        let firstCircleTimestamp = 0;
        const colorStageDuration = 2000; // 2 seconds per color stage
        const totalColorCycleDuration = colorStageDuration * 4; // 8 seconds total cycle
        let currentTheme = 'daytime'; // Track current theme
        let audioStarted = false; // Track if audio context is started

        // --- Movement & Collision Variables ---
        const circlesData = new Map();
        let boundaryRadiusPx = 0;
        let canvasCenterX = 0;
        let canvasCenterY = 0;
        let lastTimestamp = 0;
        const floatSpeedFactor = 25;
        const overlapThreshold = 15;

        // --- Shrink & Fade Logic Variables ---
        const shrinkDurationSeconds = 5;
        const shrinkDurationMs = shrinkDurationSeconds * 1000;
        const fadeDurationSeconds = 1; // Duration of the main circle fade-out
        const fadeDurationMs = fadeDurationSeconds * 1000;
        const fadeTriggerDelay = 3000;

        // --- Utility Functions ---
        function calculateBoundary() {
            canvasCenterX = window.innerWidth / 2;
            canvasCenterY = window.innerHeight / 2;
            const centerTCircleElement = document.getElementById('CenterTCircle');
            if (centerTCircleElement) {
                boundaryRadiusPx = centerTCircleElement.offsetWidth / 2;
            } else {
                console.error("#CenterTCircle element not found.");
                boundaryRadiusPx = 0;
            }
        }

        // --- Get Current Color Based on Time ---
        function getCurrentDynamicColors(currentTime = performance.now()) {
            let colorHex, colorRgbaZero, particleColorHex;
            const styles = getComputedStyle(document.body);
            colorHex = styles.getPropertyValue('--dynamic-color1').trim();
            colorRgbaZero = styles.getPropertyValue('--dynamic-color1-rgba').trim();
            particleColorHex = colorHex;
            if (firstCircleTimestamp > 0) {
                const elapsedTime = currentTime - firstCircleTimestamp;
                const timeInCycle = elapsedTime % totalColorCycleDuration;
                if (timeInCycle < colorStageDuration) {
                } else if (timeInCycle < 2 * colorStageDuration) {
                     colorHex = styles.getPropertyValue('--dynamic-color2').trim();
                     colorRgbaZero = styles.getPropertyValue('--dynamic-color2-rgba').trim();
                     particleColorHex = colorHex;
                } else if (timeInCycle < 3 * colorStageDuration) {
                     colorHex = styles.getPropertyValue('--dynamic-color3').trim();
                     colorRgbaZero = styles.getPropertyValue('--dynamic-color3-rgba').trim();
                     particleColorHex = colorHex;
                } else {
                     colorHex = styles.getPropertyValue('--dynamic-color2').trim();
                     colorRgbaZero = styles.getPropertyValue('--dynamic-color2-rgba').trim();
                     particleColorHex = colorHex;
                }
            }
             if (!colorHex) {
                 colorHex = '#EAEE81';
                 colorRgbaZero = 'rgba(234, 238, 129, 0)';
                 particleColorHex = '#EAEE81';
             }
             return {
                 gradient: `radial-gradient(circle, ${colorHex} 20%, ${colorRgbaZero} 100%)`,
                 particleColor: particleColorHex
             };
        }


        // --- Overlap Particle Creation Function ---
        function createOverlapParticles(x, y) {
            const currentColors = getCurrentDynamicColors();
            const numParticlesToCreate = Math.floor(Math.random() * 11) + 10;
            for (let i = 0; i < numParticlesToCreate; i++) {
                const particle = document.createElement('div');
                particle.classList.add('overlap-particle');
                const particleSize = Math.random() * 3 + 1; // 1px to 4px
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 25 + 5;
                const particleX = x + radius * Math.cos(angle);
                const particleY = y + radius * Math.sin(angle);
                particle.style.width = `${particleSize}px`;
                particle.style.height = `${particleSize}px`;
                particle.style.left = `${particleX - particleSize / 2}px`;
                particle.style.top = `${particleY - particleSize / 2}px`;
                particle.style.zIndex = '15';
                particle.style.backgroundColor = currentColors.particleColor;
                canvas.appendChild(particle);
                particle.offsetHeight;
                particle.style.opacity = 0.7;
                setTimeout(() => { particle.classList.add('fading'); }, 100);
                particle.addEventListener('transitionend', (event) => {
                    if (event.propertyName === 'opacity' && particle.parentNode) { particle.remove(); }
                });
                setTimeout(() => { if (particle.parentNode) { particle.remove(); } }, 1600);
            }
        }

        // --- REMOVED: Fade Particle Creation Function ---


        // --- Circle Creation ---
        function createCircle(x, y) {
            // *** Start audio context on first circle creation ***
            if (!audioStarted) {
                Tone.start();
                audioStarted = true;
                console.log('Audio context started');
            }

            if (firstCircleTimestamp === 0) {
                firstCircleTimestamp = performance.now();
            }

            const circleContainer = document.createElement('div');
            circleContainer.classList.add('circle');
            const circleId = 'circle-' + Date.now() + '-' + Math.random().toString(36).substring(2, 7);
            circleContainer.id = circleId;

            // *** Determine Core Size - Updated random range 1px to 20px ***
            const mainSize = Math.random() * 19 + 1; // Size 1px to 20px

            const randomZIndex = Math.floor(Math.random() * 10) + 2;
            const randomInitialScale = Math.random() * 0.4 + 0.8;

            const containerSizeMultiplier = 1.0;
            const containerSize = mainSize * containerSizeMultiplier;
            circleContainer.style.width = `${containerSize}px`;
            circleContainer.style.height = `${containerSize}px`;
            circleContainer.style.left = `${x - containerSize / 2}px`;
            circleContainer.style.top = `${y - containerSize / 2}px`;
            // *** Set random initial opacity (0.6 to 1.0) ***
            circleContainer.style.opacity = Math.random() * 0.4 + 0.6; // Range 0.6 to 1.0
            circleContainer.style.zIndex = randomZIndex;
            circleContainer.style.setProperty('--initial-scale', randomInitialScale);
            circleContainer.style.setProperty('--shrink-duration', `${shrinkDurationSeconds}s`);

            const core = document.createElement('div');
            core.classList.add('core');
            const currentColors = getCurrentDynamicColors();
            core.style.background = currentColors.gradient;
            core.style.width = `100%`;
            core.style.height = `100%`;
            circleContainer.appendChild(core);

            canvas.appendChild(circleContainer);

            // Store Circle Data
            const circleData = {
                x: x,
                y: y,
                stopped: false,
                moveOutward: (Math.sqrt((x - canvasCenterX)**2 + (y - canvasCenterY)**2) <= boundaryRadiusPx),
                particlesGenerated: false,
                element: circleContainer,
                initialSize: mainSize * randomInitialScale
            };
            circlesData.set(circleId, circleData);

            // Fading and Removal Logic
            // *** Use fixed delay instead of calculating timeToReach1px ***
            const fadeTimeoutId = setTimeout(() => {
                const currentElement = document.getElementById(circleId);
                // *** Check if element still exists before adding class ***
                if (currentElement && currentElement.parentNode) {
                    currentElement.classList.add('fading-out');
                    // *** REMOVED call to createFadeParticles ***
                }
            }, fadeTriggerDelay); // Use fixed delay (e.g., 3000ms)
            circleContainer.dataset.fadeTimeoutId = fadeTimeoutId;

            // Fallback removal timer remains based on shrink + fade durations
            const fallbackRemovalTimeoutId = setTimeout(() => {
                circlesData.delete(circleId);
                if (circleContainer.parentNode) { circleContainer.remove(); }
                clearTimeout(fadeTimeoutId);
            }, shrinkDurationMs + fadeDurationMs);
            circleContainer.dataset.fallbackRemovalTimeoutId = fallbackRemovalTimeoutId;

            // transitionend listener still removes the main circle after its opacity fade
            circleContainer.addEventListener('transitionend', (event) => {
                if (event.target === circleContainer && event.propertyName === 'opacity') {
                     circlesData.delete(circleId);
                     if (circleContainer.parentNode) { circleContainer.remove(); }
                    clearTimeout(fadeTimeoutId);
                    clearTimeout(fallbackRemovalTimeoutId);
                }
            });
        }

        // --- Clear All Circles Function ---
        function clearAllCircles() {
            // *** Updated selector to only clear overlap particles ***
            const allParticles = document.querySelectorAll('.overlap-particle');
            allParticles.forEach(p => p.remove());

            for (let [id, data] of circlesData) {
                const circleElement = data.element;
                 if (circleElement) {
                     const fadeId = circleElement.dataset.fadeTimeoutId;
                     const fallbackId = circleElement.dataset.fallbackRemovalTimeoutId;
                     if (fadeId) clearTimeout(parseInt(fadeId));
                     if (fallbackId) clearTimeout(parseInt(fallbackId));
                     if (circleElement.parentNode) {
                         circleElement.remove();
                     }
                 }
            }
            circlesData.clear();
            mouseHistory = [];
            firstCircleTimestamp = 0; // Reset timestamp to restart color cycle
        }


        // --- Main Animation Loop ---
        function gameLoop(timestamp) {
            const now = performance.now();
            if (lastTimestamp === 0) { lastTimestamp = now; }
            const deltaTime = Math.max(0, (now - lastTimestamp) / 1000);
            lastTimestamp = now;

            // Delayed Circle Creation
            if (now - lastCircleTime > circleInterval) {
                for (let i = 0; i < mouseHistory.length; i++) {
                    const entry = mouseHistory[i];
                    if (now - entry.time >= creationDelayMs) {
                        createCircle(entry.x, entry.y);
                        lastCircleTime = now;
                        mouseHistory.splice(0, i + 1);
                        break;
                    } else {
                        break;
                    }
                }
            }

            // History Cleanup
             if (mouseHistory.length > 0 && now - mouseHistory[0].time > creationDelayMs + 150) {
                mouseHistory = mouseHistory.filter(entry => now - entry.time < creationDelayMs + 150);
             }

            // Circle Movement & Collision
            if (boundaryRadiusPx > 0) {
                for (let [id, data] of circlesData) {
                    const circleElement = data.element;
                    if (!circleElement || !circleElement.parentNode) { circlesData.delete(id); continue; }
                    if (data.stopped) { continue; }

                    let directionX, directionY;
                    if (data.moveOutward) {
                        directionX = data.x - canvasCenterX;
                        directionY = data.y - canvasCenterY;
                    } else {
                        directionX = canvasCenterX - data.x;
                        directionY = canvasCenterY - data.y;
                    }

                    const distanceToCenter = Math.sqrt(directionX * directionX + directionY * directionY);
                    let normalizedVx = 0, normalizedVy = 0;

                    if (distanceToCenter > 1) {
                       normalizedVx = directionX / distanceToCenter;
                       normalizedVy = directionY / distanceToCenter;
                    } else if (!data.moveOutward) {
                        data.stopped = true; continue;
                    }

                    let nextX = data.x + normalizedVx * deltaTime * floatSpeedFactor;
                    let nextY = data.y + normalizedVy * deltaTime * floatSpeedFactor;
                    const nextDx = nextX - canvasCenterX, nextDy = nextY - canvasCenterY;
                    const nextDist = Math.sqrt(nextDx * nextDx + nextDy * nextDy);

                    if ((!data.moveOutward && nextDist <= boundaryRadiusPx) || (data.moveOutward && nextDist >= boundaryRadiusPx)) {
                        const angle = Math.atan2(nextDy, nextDx);
                        data.x = canvasCenterX + boundaryRadiusPx * Math.cos(angle);
                        data.y = canvasCenterY + boundaryRadiusPx * Math.sin(angle);
                        data.stopped = true;
                        if (circleElement) { circleElement.classList.add('stopped-scaled'); }

                        if (!data.particlesGenerated) {
                            let overlapCount = 0;
                            for (let [otherId, otherData] of circlesData) {
                                if (id !== otherId && otherData.stopped) {
                                    const dxOther = data.x - otherData.x;
                                    const dyOther = data.y - otherData.y;
                                    if (Math.sqrt(dxOther*dxOther + dyOther*dyOther) <= overlapThreshold) {
                                        overlapCount++;
                                    }
                                }
                            }
                            if (overlapCount >= 3) {
                                createOverlapParticles(data.x, data.y);
                                data.particlesGenerated = true;
                            }
                        }
                    } else {
                        data.x = nextX;
                        data.y = nextY;
                    }

                    const elementWidth = circleElement.offsetWidth;
                    const elementHeight = circleElement.offsetHeight;
                    if (elementWidth > 0 && elementHeight > 0) {
                       circleElement.style.left = `${data.x - elementWidth / 2}px`;
                       circleElement.style.top = `${data.y - elementHeight / 2}px`;
                    }
                }
            }
            requestAnimationFrame(gameLoop);
        }

        // --- Event Listeners ---
        canvas.addEventListener('mousemove', (event) => {
            // *** Clamp recorded mouse coordinates to viewport ***
            mouseX = Math.max(0, Math.min(event.clientX, window.innerWidth));
            mouseY = Math.max(0, Math.min(event.clientY, window.innerHeight));
            mouseHistory.push({ x: mouseX, y: mouseY, time: performance.now() });
        });

         // REMOVED: clearButton listener

         // Theme Toggle Listener - Updated to clear circles
         themeToggle.addEventListener('click', () => {
             clearAllCircles(); // Clear existing circles first
             document.body.classList.toggle('nighttime');
             if (document.body.classList.contains('nighttime')) {
                 // *** Updated button text ***
                 themeToggle.textContent = '☀️';
                 currentTheme = 'nighttime';
             } else {
                 // *** Updated button text ***
                 themeToggle.textContent = '🌙';
                 currentTheme = 'daytime';
             }
             calculateBoundary(); // Recalculate boundary just in case
         });

         window.addEventListener('resize', calculateBoundary);

         window.addEventListener('load', () => {
             calculateBoundary();
             lastTimestamp = performance.now();
             requestAnimationFrame(gameLoop);
         });

    </script>
</body>
</html>
